name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - architecture/red-team-engine-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare required video test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg util-linux
          node scripts/check-video-test-toolchain.js

      - name: Run automated tests
        run: npm test

      - name: Rehearse every migration on the disposable PostgreSQL 17 service (fresh database, additive-only, credential-table privileges)
        run: node scripts/rehearse-migrations.js

      - name: Run real PostgreSQL billing adversarial tests
        run: npm run test:billing:postgres

      - name: Run real PostgreSQL campaign persistence tests
        run: npm run test:campaign:postgres

      - name: Run real PostgreSQL onboarding security tests
        run: npm run test:onboarding:postgres

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check index.js
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  container-artifacts:
    name: Node 22 Docker and Buildpack artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKER_IMAGE: bizgenie-api:ci-docker
      BUILDPACK_IMAGE: bizgenie-api:ci-buildpack
      BUILDPACK_BUILDER: gcr.io/buildpacks/builder:google-22
      PACK_VERSION: 0.40.8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create disposable local admin key
        shell: bash
        run: |
          admin_key="bg-ci-002-$(openssl rand -hex 16)"
          echo "::add-mask::$admin_key"
          echo "ADMIN_KEY=$admin_key" >> "$GITHUB_ENV"

      - name: Build Dockerfile image locally
        shell: bash
        run: |
          docker version
          docker build --tag "$DOCKER_IMAGE" .
          docker image inspect --format 'Docker image ID: {{.Id}}' \
            "$DOCKER_IMAGE"

      - name: Verify Docker image Node 22 runtime
        shell: bash
        run: |
          node_version="$(docker run --rm "$DOCKER_IMAGE" node --version)"
          echo "Docker image Node version: $node_version"
          [[ "$node_version" == v22.* ]]

      - name: Smoke test Dockerfile image
        run: bash scripts/smoke-container.sh "$DOCKER_IMAGE" bizgenie-ci-docker

      - name: Production image - pinned media toolchain present, non-root, working
        shell: bash
        run: |
          docker run --rm "$DOCKER_IMAGE" sh -c 'echo "uid=$(id -u) user=$(id -un)"; test "$(id -u)" != 0; . /etc/os-release; echo "$PRETTY_NAME"; dpkg-query -W -f="${Package}=${Version}\n" ffmpeg bubblewrap util-linux; ffprobe -version | head -1; ffmpeg -version | head -1; bwrap --version; prlimit --version | head -1'

      - name: Production image - media self-test passes or fails CLOSED (never silently degraded)
        shell: bash
        run: |
          # Default isolation is the hardened one. On a host/seccomp profile that forbids user namespaces the self-test must say so (exit 2), not pass.
          set +e
          docker run --rm "$DOCKER_IMAGE" node scripts/staging/toolchain-selftest.js; code=$?
          echo "hardened isolation under the default Docker profile: exit $code (0 = works, 2 = refused, fail closed)"
          [ "$code" = 0 ] || [ "$code" = 2 ] || exit 1
          # The tools and rules themselves, independent of namespaces (isolated staging mode). This one must pass.
          docker run --rm --env VIDEO_INSPECTION_ISOLATION=local "$DOCKER_IMAGE" node scripts/staging/toolchain-selftest.js || exit 1

      - name: Production image - what the hardened (bubblewrap) isolation needs from its runtime (informational)
        shell: bash
        run: |
          # Not a gate: it records, with the exact error text, which container profile (if any) lets bubblewrap build its sandbox, so the deployment platform can be chosen on evidence.
          set +e
          i=0
          for opts in "" "--security-opt seccomp=unconfined --security-opt apparmor=unconfined" "--security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined" "--privileged"; do
            i=$((i+1)); echo "::group::profile $i: ${opts:-<docker default>}"
            docker run --rm $opts "$DOCKER_IMAGE" sh -c 'bwrap --unshare-all --unshare-net --unshare-user --die-with-parent --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp true; echo "bwrap exit $?"' 2>&1
            docker run --rm $opts "$DOCKER_IMAGE" node scripts/staging/toolchain-selftest.js; echo "self-test (hardened) exit $?"
            echo "::endgroup::"
          done
          exit 0

      - name: Install pinned pack CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            "https://github.com/buildpacks/pack/releases/download/v${PACK_VERSION}/pack-v${PACK_VERSION}-linux.tgz" \
            --output /tmp/pack.tgz
          sudo tar --extract --gzip --file /tmp/pack.tgz \
            --directory /usr/local/bin --no-same-owner pack
          rm /tmp/pack.tgz
          pack version

      - name: Build Google Buildpack image locally
        shell: bash
        run: |
          echo "Google Buildpack builder: $BUILDPACK_BUILDER"
          pack build "$BUILDPACK_IMAGE" \
            --builder "$BUILDPACK_BUILDER" \
            --path . \
            --pull-policy if-not-present
          docker image inspect --format 'Buildpack image ID: {{.Id}}' \
            "$BUILDPACK_IMAGE"

      - name: Verify Buildpack image Node 22 runtime
        shell: bash
        run: |
          node_version="$(
            docker run --rm --entrypoint launcher \
              "$BUILDPACK_IMAGE" -- node --version
          )"
          echo "Buildpack image Node version: $node_version"
          [[ "$node_version" == v22.* ]]

      - name: Smoke test Buildpack image
        run: bash scripts/smoke-container.sh "$BUILDPACK_IMAGE" bizgenie-ci-buildpack

      - name: Remove local images
        if: always()
        run: docker image rm --force "$DOCKER_IMAGE" "$BUILDPACK_IMAGE" || true
